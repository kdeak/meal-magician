# SM kicker — thin stub over the canonical watchdog in the factory home.
# All logic (sm-liveness + head-completeness) lives in
# IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm-kicker.yml.
# Why this repo needs it: GitHub silently drops schedule() crons on quiet
# repos — the kicker re-dispatches machine-sm.yml on its OWN schedule +
# every non-main push, so the state machine keeps moving even when the
# machine-sm cron is dropped.
#
# Event-driven wake-up: validation verdicts arrive as CI
# conclusions (your PR CI workflow);
# reacting to them closes the gap — latch/merge happens within seconds of
# the CI finishing, cron or no cron.
name: SM kicker

run-name: '🥁 kicker ${{ github.event_name }} ${{ github.ref_name }}'

on:
  push:
    branches-ignore: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Quality']
    types: [completed]
permissions:
  actions: write
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: sm-kicker
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      machine_sm_available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check whether machine-sm.yml is dispatchable on the default branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/machine-sm.yml" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::machine-sm.yml is not yet available on the default branch; skipping kicker during factory bootstrap."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  kicker:
    needs: preflight
    if: needs.preflight.outputs.machine_sm_available == 'true'
    uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm-kicker.yml@main
    with:
      runner: ubuntu-latest
      sm_workflow: machine-sm.yml
      ci_workflow: 'quality.yml'
      ci_display_name: 'Quality'
      # The required protection context is the single `test` job named
      # "Java unit tests" ("Protect main" ruleset — see unit-tests.yml).
      required_contexts: 'quality'
